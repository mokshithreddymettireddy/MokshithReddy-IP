<!DOCTYPE html>
<html>
<head>
    <title>Welcome to My Website</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: lightblue;
            font-family: Cambria;
            font-size: 14px;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        marquee {
            color: rgb(64, 183, 234);
            font-weight:italic;
            margin: 20px;
        }

        .btn {
            background-color: rgb(81, 163, 231);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 80%;
            margin: 30px auto;
        }

        .grid-item {
            background-color: rgb(193, 162, 224);
            border: 2px solid rgb(116, 116, 218);
            padding: 20px;
            color: rgb(63, 63, 215);
            font-weight: bold;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>WELCOME TO MY WEBSITE</h1>

    <marquee behavior="scroll" direction="left" scrollamount="5">
        Welcome to My Website! Learn HTML and CSS with a simple example.
    </marquee>

    <p>"This page is created using HTML and CSS"</p>

    <button class="btn">Click Here</button>

    <div class="grid-container">
        <div class="grid-item">HTML</div>
        <div class="grid-item">CSS</div>
        <div class="grid-item">JavaScript</div>
        <div class="grid-item">Web Design</div>
        <div class="grid-item">Responsive Layout</div>
        <div class="grid-item">Programming</div>
    </div>

</body>
</html>
