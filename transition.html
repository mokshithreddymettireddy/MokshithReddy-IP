<!DOCTYPE html>
<html>
<head>
    <title>TRANSITION</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            background-color: #bacfe1;
            margin: 0;
            overflow-x: hidden;
        }

        h2{
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 38px;
            font-weight: 700;
            color: #1c2b39;
            letter-spacing: 3px;
            margin-top: 30px;
        }

        .box{
            width: 200px;
            height: 200px;
            border-radius: 40%;
            background-color: rgb(105, 138, 236);
            color: rgb(187, 236, 243);
            margin: 100px auto;
            line-height: 200px;
            font-size: 22px;
            font-weight: bold;
            transition: transform 0.9s ease,
                        background-color 0.9s ease,
                        border-radius 0.9s ease,
                        box-shadow 0.9s ease;
        }

        .box:hover{
            transform: rotate(18deg) scale(1.4);
            border-radius: 50%;
            background-color: rgb(198, 77, 56);
            box-shadow: 0 50px 50px rgba(231, 65, 65, 0.3);
        }
        .scroll-container{
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(90deg,#4a90e2,#6a5acd,#4a90e2);
            padding: 12px 0;
            overflow: hidden;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
        }
        .scroll-text{
            display: inline-block;
            white-space: nowrap;
            color: rgb(189, 234, 234);
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 600;
            animation: scroll 12s linear infinite;
        }
        @keyframes scroll{
            from{
                transform: translateX(100%);
            }
            to{
                transform: translateX(-100%);
            }
        }
    </style>
</head>

<body>

    <h2>CSS-TRANSITION</h2>

    <div class="box">
        Try Me!
    </div>

    <!-- Scrolling Footer -->
    <div class="scroll-container">
        <div class="scroll-text">
            ✨ Welcome to My CSS Transition Project • Hover over the box to experience the animation • Designed by Mokshith Reddy ✨
        </div>
    </div>

</body>
</html>
